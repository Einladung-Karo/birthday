<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karos B-Day & Einweihungsparty - Save the Date</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 0;
      width: 100%;
      min-height: 100vh;
      background: #0f0f11;
      font-family: 'Playfair Display', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    /* Card Container */
    .card {
      width: 90%;
      max-width: 440px;
      padding: 40px 25px;
      text-align: center;
      border-radius: 24px;
      background-image: url('03c7b7376b525b4ddd27b404d1195dea.jpg');
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Gradient Overlay für exzellente Lesbarkeit */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.7) 100%);
      z-index: 0;
    }

    .card > * {
      position: relative;
      z-index: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Typografie */
    .subtitle {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      opacity: 0.9;
      margin-bottom: 5px;
      color: #e2d8ce;
    }

    .title-script {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #f3e5ab; /* Warmes Roségold / Gold */
      margin: 0;
      line-height: 1.1;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }

    .names-container {
      margin: 15px 0 20px 0;
      min-height: 40px;
    }

    .names {
      font-family: 'Dancing Script', cursive;
      font-size: 2.1rem;
      color: #ffffff;
      border-right: 2px solid #f3e5ab;
      white-space: nowrap;
      display: inline-block;
      animation: blinkCursor 0.8s infinite;
    }

    @keyframes blinkCursor {
      0%, 100% { border-color: transparent; }
      50% { border-color: #f3e5ab; }
    }

    /* Badge für Motto */
    .info-badge {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      padding: 8px 18px;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
      color: #f3e5ab;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Datum-Bereich */
    .event-date-box {
      margin: 10px 0 20px 0;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 16px 25px;
      border-radius: 18px;
      width: 100%;
      box-shadow: inset 0 0 15px rgba(255,255,255,0.05);
    }

    .day-name {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: #e2d8ce;
    }

    .number {
      font-size: 3.8rem;
      font-weight: 700;
      line-height: 1;
      margin: 4px 0;
      cursor: pointer;
      display: inline-block;
      transition: transform 0.3s ease, color 0.3s ease;
      color: #ffffff;
    }

    .number:hover {
      transform: scale(1.12) rotate(-2deg);
      color: #f3e5ab;
    }

    .month-year {
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      font-weight: 600;
    }

    .time-location {
      font-size: 0.9rem;
      opacity: 0.9;
      margin-top: 6px;
      color: #f3e5ab;
    }

    /* Countdown */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 15px 0 20px 0;
      width: 100%;
    }

    .countdown-item {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 6px;
      flex: 1;
      min-width: 55px;
    }

    .countdown-value {
      font-size: 1.35rem;
      font-weight: 700;
      display: block;
      color: #ffffff;
    }

    .countdown-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.8;
      margin-top: 2px;
      display: block;
      color: #e2d8ce;
    }

    /* Location Box */
    .location-box {
      font-size: 0.85rem;
      margin-bottom: 20px;
      opacity: 0.95;
      line-height: 1.4;
      background: rgba(0,0,0,0.3);
      padding: 10px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      width: 100%;
    }

    /* Buttons */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn {
      padding: 13px 20px;
      font-size: 0.92rem;
      font-family: 'Playfair Display', serif;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 30px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.28);
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }

    .btn-primary {
      background: rgba(243, 229, 171, 0.22);
      border-color: rgba(243, 229, 171, 0.45);
      color: #f3e5ab;
    }

    .btn-primary:hover {
      background: rgba(243, 229, 171, 0.38);
      color: #ffffff;
    }

    /* Easter Egg Popup */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .modal-content {
      background: #1a1a1d;
      border: 1px solid rgba(243, 229, 171, 0.25);
      padding: 28px 22px;
      border-radius: 20px;
      text-align: center;
      max-width: 330px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    .modal h3 {
      margin-top: 0;
      color: #f3e5ab;
      font-size: 1.4rem;
    }

    .modal input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border-radius: 10px;
      border: 1px solid #444;
      background: #28282e;
      color: #fff;
      text-align: center;
      font-size: 0.95rem;
    }

    .modal input:focus {
      outline: none;
      border-color: #f3e5ab;
    }

    #result {
      margin-top: 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    #secretImage {
      display: none;
      margin-top: 15px;
      max-width: 100%;
      border-radius: 10px;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 0.85rem;
      margin-top: 15px;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="subtitle">Einladung zur Party</div>
  <div class="title-script">Karos B-Day & Einweihung</div>

  <div class="names-container">
    <div class="names" id="typed"></div>
  </div>

  <div class="info-badge">
    🔥 Motto: Sexy Anziehen
  </div>

  <div class="event-date-box">
    <div class="day-name">Samstag</div>
    <!-- Klicke auf die Zahl für das Easter Egg -->
    <div class="number" title="Geheimnis?">17</div>
    <div class="month-year">Oktober 2026</div>
    <div class="time-location">⏰ Ab 18:00 Uhr</div>
  </div>

  <div class="countdown" id="countdown"></div>

  <div class="location-box">
    📍 <strong>Location:</strong><br>
    Straße 123, Wildau
  </div>

  <div class="button-group">
    <a class="btn btn-primary" href="Karo_Party.ics" download>
      📅 Zum Kalender hinzufügen
    </a>
    <a class="btn" href="plan.html">
      🍹 Ablaufplan & Infos
    </a>
  </div>
</div>

<!-- Easter Egg Popup -->
<div id="easterEgg" class="modal">
  <div class="modal-content">
    <h3>✨ Geheimes Rätsel</h3>
    <p style="font-size: 0.88rem; opacity: 0.85; line-height: 1.4;">Wie heißt der Ort, an dem wir uns verlobt haben?</p>
    <input id="answer" type="text" placeholder="Antwort eingeben...">
    <button id="checkAnswer" class="btn btn-primary" style="width:100%;">Prüfen</button>
    <div id="result"></div>
    <img id="secretImage" src="unserbild.jpg" alt="Unser Bild">
    <button id="closeModal" class="close-btn">Schließen</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  // Typing Effekt
  const text = "Double Celebration ✨";
  const typed = document.getElementById("typed");
  let i = 0;

  function typeWriter() {
    if (i < text.length) {
      typed.textContent += text.charAt(i);
      i++;
      setTimeout(typeWriter, 110);
    } else {
      setTimeout(() => {
        typed.style.borderRight = 'none';
      }, 2000);
    }
  }
  typeWriter();

  // Countdown Zielzeit: 17. Oktober 2026, 18:00 Uhr
  const eventDate = new Date("2026-10-17T18:00:00").getTime();
  const countdownEl = document.getElementById('countdown');

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = eventDate - now;

    if(distance < 0) {
      countdownEl.innerHTML = "<div style='padding:10px; font-weight:bold; color:#f3e5ab;'>Die Party läuft! 🎉</div>";
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    countdownEl.innerHTML = `
      <div class="countdown-item"><span class="countdown-value">${days}</span><span class="countdown-label">Tage</span></div>
      <div class="countdown-item"><span class="countdown-value">${hours}</span><span class="countdown-label">Std</span></div>
      <div class="countdown-item"><span class="countdown-value">${minutes}</span><span class="countdown-label">Min</span></div>
      <div class="countdown-item"><span class="countdown-value">${seconds}</span><span class="countdown-label">Sek</span></div>
    `;
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  // Easter Egg Modal Logik
  const dateNumber = document.querySelector('.number');
  const modal = document.getElementById('easterEgg');
  const closeModal = document.getElementById('closeModal');

  dateNumber.addEventListener('click', () => {
    modal.style.display = 'flex';
  });

  closeModal.addEventListener('click', () => {
    modal.style.display = 'none';
  });

  document.getElementById('checkAnswer').addEventListener('click', () => {
    const answer = document.getElementById('answer').value.trim().toLowerCase();
    const normalizedAnswer = answer.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

    if(["norwegen", "tromso", "tromsø"].includes(normalizedAnswer)) {
      document.getElementById('result').textContent = 'Richtig! 🎉';
      document.getElementById('result').style.color = '#a8ffb2';
      document.getElementById('secretImage').style.display = 'block';
    } else {
      document.getElementById('result').textContent = 'Falsch, probier es nochmal! 😉';
      document.getElementById('result').style.color = '#ff8e8e';
      document.getElementById('secretImage').style.display = 'none';
    }
  });
});
</script>

</body>
</html>
