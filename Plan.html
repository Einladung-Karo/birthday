<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ablaufplan - Karos B-Day & Einweihungsparty</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 0;
      width: 100%;
      min-height: 100vh;
      background: #0f0f11;
      font-family: 'Playfair Display', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    .card {
      width: 90%;
      max-width: 440px;
      padding: 40px 25px;
      text-align: center;
      border-radius: 24px;
      background-image: url('03c7b7376b525b4ddd27b404d1195dea.jpg');
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
      animation: fadeIn 1s ease forwards;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.52) 0%, rgba(0,0,0,0.78) 100%);
      z-index: 0;
    }

    .card > * {
      position: relative;
      z-index: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .title-script {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #f3e5ab;
      margin: 0 0 4px 0;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }

    .subtitle {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      opacity: 0.85;
      margin-bottom: 25px;
      color: #e2d8ce;
    }

    .motto-banner {
      background: rgba(243, 229, 171, 0.15);
      border: 1px solid rgba(243, 229, 171, 0.3);
      padding: 10px 15px;
      border-radius: 12px;
      font-size: 0.88rem;
      color: #f3e5ab;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    /* Timeline Styling */
    .timeline {
      text-align: left;
      margin: 20px 0 30px 10px;
      padding-left: 15px;
      border-left: 2px solid rgba(243, 229, 171, 0.4);
    }

    .timeline-item {
      margin-bottom: 22px;
      position: relative;
      padding-left: 18px;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -22px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f3e5ab;
      box-shadow: 0 0 10px rgba(243, 229, 171, 0.8);
    }

    .time {
      font-weight: 700;
      color: #f3e5ab;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }

    .event-title {
      font-size: 1.1rem;
      margin: 3px 0 0 0;
      font-weight: 600;
    }

    .event-desc {
      font-size: 0.82rem;
      opacity: 0.8;
      margin-top: 2px;
    }

    .btn-back {
      display: inline-block;
      padding: 12px 28px;
      font-size: 0.9rem;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 30px;
      text-decoration: none;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<div class="card">
  <h1 class="title-script">Ablauf der Feier</h1>
  <div class="subtitle">Programmübersicht</div>

  <div class="motto-banner">
    🔥 <strong>Motto:</strong> Sexy Anziehen<br>
    📍 <strong>Adresse:</strong> Straße 123, Wildau
  </div>

  <div class="timeline">
    <div class="timeline-item">
      <div class="time">18:00 Uhr</div>
      <div class="event-title">Eintreffen der Gäste</div>
      <div class="event-desc">Welcome Drink & Ankommen</div>
    </div>
    <div class="timeline-item">
      <div class="time">19:00 Uhr</div>
      <div class="event-title">Bierpong Turnier</div>
      <div class="event-desc">Macht euch bereit für die Battles! 🍻</div>
    </div>
    <div class="timeline-item">
      <div class="time">20:00 Uhr</div>
      <div class="event-title">DJ & Party Time</div>
      <div class="event-desc">Dancefloor eröffnet & Open End 🔥</div>
    </div>
  </div>

  <a href="index.html" class="btn-back">← Zurück zur Einladung</a>
</div>

</body>
</html>
